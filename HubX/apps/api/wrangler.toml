name = "zkhubx-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Supabase 环境变量（优先作为存储引擎）
# 本地联调：在 .dev.vars 中配置 SUPABASE_URL 与 SUPABASE_KEY
# 生产部署：通过 wrangler secret put SUPABASE_KEY 注入，SUPABASE_URL 可写入 [vars]
[vars]
SUPABASE_URL = "https://egsfhdlcrcnxjqdejplh.supabase.co"

# Cloudflare D1 兼容保留（未配置 Supabase 时作为兜底）
[[d1_databases]]
binding = "DB"
database_name = "zkhubx-db"
database_id = "ac02e216-2523-4a84-aa3e-f1eedbd53339"

